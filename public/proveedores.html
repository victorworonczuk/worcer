<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worcer · Proveedores</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#408CC8" />
  <link rel="stylesheet" href="assets/piezas.css" />
  <link rel="stylesheet" href="assets/produccion.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <img src="/icons/logo-worcer.jpg" alt="Worcer" class="topbar-logo" />
      <div>
        <h1>Worcer · Proveedores</h1>
      <div class="subtitle" id="user-subtitle">Cargando…</div>
    </div>
    </div>
    <div class="nav-menu">
      <button type="button" id="hamburger-btn" class="hamburger-btn" aria-label="Menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-dropdown" id="nav-dropdown"></nav>
    </div>
  </header>

  <main class="piezas-main">
    <div class="panel">
      <div class="filters">
        <div class="field-inline">
          <label for="f-search">Buscar</label>
          <input type="text" id="f-search" placeholder="Nombre, CUIT, rubro..." />
        </div>
        <button type="button" id="btn-nuevo-proveedor" class="btn-primary">+ Nuevo proveedor</button>
      </div>
      <p class="nota-pie" id="contador"></p>
    </div>

    <div class="panel">
      <div class="table-wrap">
        <table class="pivot tabla-proveedores">
          <thead>
            <tr>
              <th class="col-grupo">Nombre</th>
              <th>CUIT</th>
              <th>Rubro</th>
              <th class="col-grupo">Contacto</th>
              <th>Localidad</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td class="loading" colspan="6">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-panel">
      <h2>Nuevo proveedor</h2>
      <form id="form-nuevo-proveedor">
        <label>Nombre / Razón social *
          <input type="text" id="np-nombre" required />
        </label>
        <label>CUIT
          <input type="text" id="np-cuit" placeholder="30-12345678-9" />
        </label>
        <label>Rubro
          <input type="text" id="np-rubro" placeholder="Materia prima, transporte, servicios..." />
        </label>
        <label>Localidad
          <input type="text" id="np-localidad" />
        </label>
        <label>Teléfono
          <input type="text" id="np-telefono" />
        </label>
        <label>Email
          <input type="email" id="np-email" />
        </label>
        <p class="modal-error" id="form-error"></p>
        <div class="modal-actions">
          <button type="button" id="btn-cancelar" class="btn-secondary">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/proveedores.js"></script>
  <script src="assets/nav.js"></script>
</body>
</html>
