<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worcer · Pedidos por vendedor</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#408CC8" />
  <link rel="stylesheet" href="assets/piezas.css" />
  <link rel="stylesheet" href="assets/produccion.css" />
  <link rel="stylesheet" href="assets/pedidos-vendedor.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <img src="/icons/logo-worcer.jpg" alt="Worcer" class="topbar-logo" />
      <div>
        <h1>Worcer · Pedidos por vendedor</h1>
      <div class="subtitle" id="user-subtitle">Cargando…</div>
    </div>
    </div>
    <div class="nav-menu">
      <button type="button" id="hamburger-btn" class="hamburger-btn" aria-label="Menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-dropdown" id="nav-dropdown"></nav>
    </div>
  </header>

  <main class="piezas-main">
    <div class="panel">
      <div class="filters">
        <div class="field-inline">
          <label for="f-mes">Mes</label>
          <select id="f-mes"></select>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2 class="panel-title">Cantidad de pedidos</h2>
      <div id="resumen-cantidad" class="resumen"></div>
      <div class="table-wrap">
        <table class="pivot tabla-dias">
          <thead id="thead-cantidad"></thead>
          <tbody id="tbody-cantidad">
            <tr><td class="loading">Cargando datos…</td></tr>
          </tbody>
        </table>
      </div>
      <p class="nota-pie" id="nota-pie-cantidad"></p>
    </div>

    <div class="panel">
      <h2 class="panel-title">Pedidos cotizados ($)</h2>
      <div id="resumen-monto" class="resumen"></div>
      <div class="table-wrap">
        <table class="pivot tabla-dias">
          <thead id="thead-monto"></thead>
          <tbody id="tbody-monto">
            <tr><td class="loading">Cargando datos…</td></tr>
          </tbody>
        </table>
      </div>
      <p class="nota-pie" id="nota-pie-monto"></p>
    </div>

    <div class="panel">
      <h2 class="panel-title">Total acumulado del año</h2>
      <div class="table-wrap">
        <table class="pivot">
          <thead>
            <tr>
              <th class="col-grupo">Vendedor</th>
              <th>Cantidad de pedidos</th>
              <th>Pedidos valorizados ($)</th>
              <th>%</th>
            </tr>
          </thead>
          <tbody id="tbody-anual">
            <tr><td class="loading">Cargando datos…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/pedidos-vendedor.js"></script>
  <script src="assets/nav.js"></script>
</body>
</html>
