<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worcer · Análisis de piezas</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#408CC8" />
  <link rel="stylesheet" href="assets/piezas.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <img src="/icons/logo-worcer.jpg" alt="Worcer" class="topbar-logo" />
      <div>
        <h1>Worcer · Análisis de piezas</h1>
      <div class="subtitle" id="user-subtitle">Cargando…</div>
    </div>
    </div>
    <div class="nav-menu">
      <button type="button" id="hamburger-btn" class="hamburger-btn" aria-label="Menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-dropdown" id="nav-dropdown">
        <a href="/nueva-factura.html" class="nav-item" title="Cargá acá una factura del sistema de facturación, a mano, una por una.">Cargar factura</a>
        <a href="/movimiento-piezas.html" class="nav-item" title="Subí acá los reportes &quot;Salidas de Stocks&quot; (.xlsx) — siempre después de Importar ventas, nunca antes.">Movimiento de piezas</a>
        <a href="/produccion.html" class="nav-item" title="Reporte consolidado de producción, venta y rotura por pieza. Solo consulta, no se carga nada acá.">Producción</a>
        <a href="/panel-comercial.html" class="nav-item" title="Ventas, márgenes, punto de equilibrio y de dónde viene la facturación. Solo consulta, no se carga nada acá.">Panel comercial</a>
        <a href="/lista-precios.html" class="nav-item" title="Lista de precios vigente y descuentos por escala. Solo consulta, no se carga nada acá.">Lista de precios</a>
        <a href="/index.html" class="nav-item">← Ver dashboard</a>
        <a href="/api/logout" class="nav-item">Cerrar sesión</a>
      </nav>
    </div>
  </header>

  <main class="piezas-main">
    <div class="panel">
      <div class="filters">
        <div class="field-inline field-cliente">
          <label for="f-cliente">Cliente <span class="opcional-tag">(elegí 2 o 3 para comparar)</span></label>
          <input type="text" id="f-cliente" autocomplete="off" placeholder="Todos los clientes..." />
          <div id="cliente-suggestions" class="suggestions"></div>
          <div id="cliente-chips" class="cliente-chips"></div>
        </div>
        <div class="field-inline">
          <label for="f-vendedor">Vendedor</label>
          <select id="f-vendedor">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="field-inline">
          <label for="f-linea">Línea</label>
          <select id="f-linea">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="field-inline">
          <label for="f-pieza">Pieza / calidad</label>
          <select id="f-pieza">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="field-inline">
          <label for="f-desde">Desde</label>
          <input type="date" id="f-desde" />
        </div>
        <div class="field-inline">
          <label for="f-hasta">Hasta</label>
          <input type="date" id="f-hasta" />
        </div>
        <button type="button" id="buscar-btn" class="buscar-btn">Buscar</button>
        <button type="button" id="limpiar-btn" class="limpiar-btn">Limpiar</button>
      </div>

      <div id="resumen" class="resumen"></div>

      <div class="table-wrap">
        <table>
          <thead id="thead">
            <tr>
              <th>Cliente</th>
              <th>Línea</th>
              <th>Pieza</th>
              <th>Calidad</th>
              <th>Cantidad total</th>
              <th>Monto total</th>
              <th>N° de facturas</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="7" class="loading">Elegí filtros y hacé clic en Buscar (o buscá sin filtros para ver todo).</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/piezas.js"></script>
  <script src="assets/nav.js"></script>
</body>
</html>
